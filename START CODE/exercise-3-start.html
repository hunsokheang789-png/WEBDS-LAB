<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            flex-direction: column;
            gap:1rem;
            
        }
        .middle{
            display: flex;
            height:300px;
            gap:1rem;
            
        }
        main{
            background-color: #3cb371;
            width:415px;
            color:white;
            font-weight: bold;
            border-radius: 0.5rem;
            flex:1;
            padding:1em;
        }
        .right-side{
            background-color: #ff6347;
            width:100px;
            color:white;
            font-weight: bold;
            border-radius: 0.5rem;
            padding:1em;
            box-shadow: 0 4px 2px #e02200;
                        /* x  y  komrit dit */
        }
        header,footer{
            background-color:#1e90ff;
            color:white;
            font-weight: bold;
            height:50px;
            border-radius: 0.5rem;
            display:flex;
            align-items: center;
            padding:0 15px;
            box-shadow: 0 4px 1px #0077ea;

            }
            footer{
                background-color:#4169e1;
                box-shadow: 0 4px 1px #1d44b8;
            }
            .contain-item{
                display:flex;
                flex-wrap: wrap;
                gap:1em;

                padding:1em;
            }
            .item{
                background-color:#2f8d59;
                width:50px;
                height:20px;
                padding:20px;
                border-radius: 0.5em;
                box-shadow:  0 4px 4px #226741;
            }
    </style>
</head>
<body>
    <div class="container">
        <header>Header</header>
        <section class="middle">
            <main>
                <div>Main</div>
                <div class="contain-item">
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                </div>
            </main>
            <div class="right-side">Side bar</div>
        </section>
        <footer>Footer</footer>
    </div>
</body>
</html>
